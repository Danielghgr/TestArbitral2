name: Keep Supabase awake

# Se ejecuta solo cada 3 días (Supabase pausa el proyecto tras 7 días sin
# peticiones, así que con margen de sobra evitamos llegar a ese límite),
# y también se puede lanzar a mano desde la pestaña "Actions" de GitHub.
on:
  schedule:
    - cron: "0 8 */3 * *" # cada 3 días a las 08:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Petición de lectura a Supabase (tabla periodos, pública)
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/periodos?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
          echo "Ping a Supabase realizado correctamente."
